<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Signup</title>
    <style>
        body {
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Poppins;
            background: linear-gradient(135deg,#1e3c72,#2a5298);
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding:40px;
            border-radius:15px;
            backdrop-filter: blur(10px);
            width:320px;
            color:white;
            text-align:center;
        }

        h2 {
            margin-bottom:20px;
        }

        input {
            width:100%;
            padding:14px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            font-size:14px;
        }

        input:focus {
            outline:none;
            box-shadow:0 0 5px #00c6ff;
        }

        button {
            width:100%;
            padding:14px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            background:#4bc0c0;
            color:white;
            font-size:15px;
            cursor:pointer;
        }

        button:hover {
            background:#369999;
        }

        a {
            display:block;
            margin-top:15px;
            color:#00c6ff;
            text-decoration:none;
        }
    .header {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: white;
    letter-spacing: 2px;
text-shadow: 0 0 10px rgba(255,255,255,0.8),
             0 0 20px rgba(0,198,255,0.8);
    animation: fadeIn 1.5s ease-in-out, float 3s ease-in-out infinite;
}

/* Fade in animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Floating effect */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(8px); }
    100% { transform: translateY(0px); }
}

    </style>
</head>
<body>
<div class="header">
    💰 Expense Tracker
</div>
<div class="card">
    <h2>📝 Create Account</h2>

    <form action="signup" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <a href="login.html">Back to Login</a>
</div>

</body>
</html>
