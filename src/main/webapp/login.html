<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #141e30, #243b55);
    overflow:hidden;
}

/* SOFT GLOW EFFECT */
body::before, body::after {
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(120px);
    z-index:0;
}

body::before {
    background:#00c6ff;
    top:10%;
    left:20%;
}

body::after {
    background:#ff6ec4;
    bottom:10%;
    right:20%;
}

/* HEADER */
.header {
    position:absolute;
    top:40px;
    font-size:44px;   /* increased from 36 → 44 */
    font-weight:bold;
    color:white;
    letter-spacing:3px;  /* slightly more spacing */
    text-align:center;
    width:100%;
    text-shadow: 0 0 15px rgba(255,255,255,0.7),
                 0 0 25px rgba(0,198,255,0.6);
}

/* CARD */
.card {
    z-index:1;
    width:340px;
    padding:40px;
    border-radius:18px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
}

/* TITLE */
h2 {
    margin-bottom:20px;
}

/* INPUT */
.input-group {
    position:relative;
}

input {
    width:100%;
    padding:14px 14px 14px 40px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:14px;
}

input::placeholder {
    color:#ddd;
}

input:focus {
    outline:none;
    box-shadow:0 0 10px #00c6ff;
}

/* ICONS */
.input-group span {
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
}

/* BUTTON */
button {
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    transform:scale(1.05);
}

/* LINK */
a {
    display:block;
    margin-top:15px;
    color:#00c6ff;
    text-decoration:none;
}

a:hover {
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="header">💰 Expense Tracker</div>

<div class="card">
    <h2>🔐 Login</h2>

    <form action="login" method="post">

        <div class="input-group">
            <span></span>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <span></span>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <a href="signup.html">Create Account</a>
</div>

</body>
</html>
